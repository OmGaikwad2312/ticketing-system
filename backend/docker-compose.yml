# Local infrastructure: Redis 7 with durable AOF writes and noeviction for BullMQ, plus PostgreSQL 16.
services:
  redis:
    image: redis:7
    container_name: tickets-redis
    command: redis-server --appendonly yes --appendfsync always --maxmemory-policy noeviction --notify-keyspace-events Ex
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
  postgres:
    image: postgres:16
    container_name: tickets-pg
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: tickets
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
volumes:
  redis-data:
  pg-data:
